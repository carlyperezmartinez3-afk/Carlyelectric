<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="description" content="Carly Electric — orçamentos e custos de serviços elétricos.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="logo.png"><title>Carly Electric</title>
<style>
:root{--bg:#080808;--panel:#171717;--panel2:#222;--yellow:#ffdb00;--white:#f8f8f8;--muted:#b8bac3;--line:#303030;--green:#9ee6a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:16px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}header{position:sticky;top:0;z-index:5;background:#080808ee;backdrop-filter:blur(12px);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.brand{width:54px;height:54px;object-fit:cover;border-radius:12px}.brandtext{font-size:20px;font-weight:900;letter-spacing:.4px}.brandtext span{color:var(--yellow);display:block;font-size:11px;letter-spacing:5px}.wrap{max-width:700px;margin:auto;padding:16px 14px 100px}.hero{background:linear-gradient(130deg,#202020,#0e0e0e);border:1px solid var(--line);border-radius:24px;padding:20px;margin:8px 0 18px;position:relative;overflow:hidden}.profile{display:flex;align-items:center;gap:14px;margin-bottom:22px}.portrait{width:86px;height:86px;object-fit:cover;border:3px solid var(--yellow);border-radius:50%}.eyebrow{color:var(--yellow);font-size:12px;font-weight:800;letter-spacing:1.5px}.hero h1{font-size:29px;line-height:1.1;margin:6px 0}.muted{color:var(--muted)}.btn{padding:14px 16px;border-radius:14px;font-weight:800;display:inline-flex;justify-content:center;align-items:center;gap:8px}.primary{background:var(--yellow);color:#111}.secondary{background:var(--panel2);color:white;border:1px solid var(--line)}.full{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:var(--panel);border:1px solid var(--line);padding:17px;border-radius:18px;min-height:115px;text-align:left;color:white}.tile .ico{font-size:25px;color:var(--yellow)}.tile strong{display:block;margin:8px 0 3px}.tile small{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.section-title{font-size:22px;margin:8px 0 14px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;background:#0c0c0c;color:white;border:1px solid #454545;border-radius:11px;padding:12px;min-width:0}input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);border-color:transparent}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.totalbox{background:#24220f;border:1px solid #665900;border-radius:16px;padding:15px;margin:15px 0}.amount{font-size:27px;color:var(--yellow);font-weight:900}.stat{padding:7px 0;display:flex;justify-content:space-between;gap:8px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#101010f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px max(8px,env(safe-area-inset-bottom))}.nav button{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}.nav button b{font-size:20px;font-weight:500}.nav button.active{color:var(--yellow)}.service{border-bottom:1px solid var(--line);padding:12px 0}.service:last-child{border-bottom:0}.pill{font-size:11px;color:#111;background:var(--yellow);border-radius:999px;padding:4px 8px;font-weight:800}.small{font-size:12px}.danger{color:#ff9a9a}.quote-paper{background:#fff;color:#161616;padding:20px;border-radius:12px}.quote-paper h2{margin:0}.quote-paper .gold{color:#947c00}.hidden{display:none!important}.notice{color:var(--muted);font-size:12px;line-height:1.5}.empty{text-align:center;color:var(--muted);padding:28px 10px}@media(min-width:560px){.wrap{padding-top:24px}.hero h1{font-size:34px}}
</style></head>
<body>
<header><img class="brand" src="logo.png" alt="Logo Carly Electric"><div class="brandtext">CARLY <span>ELECTRIC</span></div><div style="margin-left:auto;color:var(--yellow);font-size:23px">⚡</div></header>
<main class="wrap" id="app"></main>
<nav class="nav"><button data-page="home" class="active"><b>⌂</b>Início</button><button data-page="new"><b>＋</b>Orçamento</button><button data-page="saved"><b>▤</b>Salvos</button><button data-page="settings"><b>⚙</b>Ajustes</button></nav>
<script>
const $=s=>document.querySelector(s);const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const catalog=[
['Iluminação','Instalação de arandela/spot comum',55,70,85],['Iluminação','Lâmpada tubular fluorescente/LED',60,70,80],['Iluminação','Lustre simples/luminária',80,90,100],['Iluminação','Lustre grande/luminária',120,135,150],['Iluminação','Refletor de jardim',90,110,120],['Iluminação','Fotocélula ou sensor de presença',75,95,115],['Iluminação','Luminária de emergência embutida',55,70,85],['Tomadas e interruptores','Tomada simples',30,40,50],['Tomadas e interruptores','Tomada dupla',40,50,60],['Tomadas e interruptores','Tomada de piso/telefone',55,60,70],['Tomadas e interruptores','Interruptor simples/pulsador',45,55,65],['Tomadas e interruptores','Interruptor three-way/four-way',55,65,75],['Tomadas e interruptores','Chave de boia superior/inferior',100,120,140],['Reparos e grande porte','Troca de disjuntor (unidade)',45,80,120],['Reparos e grande porte','Ventilador de teto',120,140,160],['Reparos e grande porte','Chuveiro elétrico simples',80,90,100],['Reparos e grande porte','Chuveiro luxo/eletrônico',120,135,150],['Reparos e grande porte','Troca de resistência de chuveiro',70,80,90],['Reparos e grande porte','Interfone (1 chamada)',130,160,190],['Reparos e grande porte','Câmeras de segurança (CFTV)',300,360,420],['Reparos e grande porte','Instalação elétrica completa (por m²)',40,60,80]];
const defaults={name:'Carlos Gálvez Tamayo',phone:'48984398019',margin:30};let settings={...defaults,...JSON.parse(localStorage.getItem('ce_settings')||'{}')};let quotes=JSON.parse(localStorage.getItem('ce_quotes')||'[]');let items=[];let page='home';
function persist(){localStorage.setItem('ce_settings',JSON.stringify(settings));localStorage.setItem('ce_quotes',JSON.stringify(quotes))}function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function render(){const root=$('#app');if(page==='home'){root.innerHTML=`<section class="hero"><div class="profile"><img class="portrait" src="carlos.jpg" alt="Carlos"><div><div class="eyebrow">SEU NEGÓCIO, SUA MARCA</div><h1>Olá, Carlos! ⚡</h1><div class="muted">${settings.name}</div><div class="muted small">Soluções elétricas residenciais</div></div></div><div class="eyebrow">VAMOS COMEÇAR?</div><h1>Crie um orçamento profissional.</h1><p class="muted">Calcule materiais, mão de obra e sua margem de lucro.</p><button class="btn primary full" id="start">＋ NOVO ORÇAMENTO　›</button></section><div class="grid"><button class="tile" data-go="new"><span class="ico">▦</span><strong>Calculadora</strong><small>Custos e lucro automático</small></button><button class="tile" data-go="catalog"><span class="ico">▤</span><strong>Catálogo</strong><small>21 serviços de referência</small></button><button class="tile" data-go="saved"><span class="ico">▣</span><strong>Meus orçamentos</strong><small>Ver e imprimir salvos</small></button><button class="tile" data-go="settings"><span class="ico">⚙</span><strong>Configurações</strong><small>Seus dados e margem</small></button></div><div class="card row"><span style="font-size:24px;color:var(--yellow)">☎</span><div><div class="muted small">ENTRE EM CONTATO</div><strong>${settings.phone}</strong></div></div><p class="notice">Os preços do catálogo são referências de mão de obra transcritas da tabela enviada e podem ser ajustados. Confirme cada valor antes de apresentar ao cliente.</p>`;$('#start').onclick=()=>go('new');root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}
else if(page==='new'){root.innerHTML=`<h1 class="section-title">Novo orçamento</h1><div class="field"><label>Nome do cliente</label><input id="client" placeholder="Nome completo"></div><div class="field"><label>Descrição do serviço</label><select id="service">${catalog.map((s,i)=>`<option value="${i}">${s[1]} — ${money(s[2])} a ${money(s[4])}</option>`).join('')}<option value="custom">Outro serviço (personalizado)</option></select></div><div id="customWrap" class="field hidden"><label>Nome do serviço personalizado</label><input id="customName" placeholder="Descreva o serviço"></div><div class="two"><div class="field"><label>Preço da mão de obra por unidade (R$)</label><input id="labor" type="number" min="0" step="0.01" value="70"></div><div class="field"><label>Quantidade</label><input id="qty" type="number" min="1" step="1" value="1"></div></div><div class="two"><div class="field"><label>Material por unidade (R$)</label><input id="material" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Transporte/outros gastos (R$)</label><input id="extra" type="number" min="0" step="0.01" value="0"></div></div><div class="field"><label>Margem de lucro: <strong id="marginLabel">${settings.margin}%</strong></label><input id="margin" type="range" min="0" max="100" step="5" value="${settings.margin}"></div><div class="totalbox"><div class="stat"><span class="muted">Mão de obra</span><strong id="laborSum">R$ 70,00</strong></div><div class="stat"><span class="muted">Materiais</span><strong id="matSum">R$ 0,00</strong></div><div class="stat"><span class="muted">Outros gastos</span><strong id="extraSum">R$ 0,00</strong></div><div class="stat"><span class="muted">Custo total</span><strong id="costSum">R$ 70,00</strong></div><div class="stat"><span class="muted">Lucro previsto</span><strong id="profitSum">R$ 21,00</strong></div><hr style="border-color:#665900"><div class="muted small">VALOR FINAL DO ORÇAMENTO</div><div class="amount" id="finalSum">R$ 91,00</div></div><button class="btn primary full" id="saveQuote">✓ SALVAR ORÇAMENTO</button><p class="notice">O lucro é calculado como percentual adicional sobre o custo total (custo × 1,30 quando a margem é 30%). Os dados ficam salvos neste aparelho.</p>`;
const service=$('#service');service.onchange=()=>{let i=service.value;if(i==='custom'){$('#customWrap').classList.remove('hidden');$('#labor').value=0}else{$('#customWrap').classList.add('hidden');$('#labor').value=catalog[Number(i)][3]}calc()};['labor','qty','material','extra','margin'].forEach(id=>$('#'+id).addEventListener('input',calc));function val(id){return Math.max(0,Number($('#'+id).value)||0)}function calc(){let q=Math.max(1,Math.floor(val('qty'))),l=val('labor')*q,m=val('material')*q,e=val('extra'),cost=l+m+e,margin=val('margin'),profit=cost*margin/100;$('#marginLabel').textContent=margin+'%';$('#laborSum').textContent=money(l);$('#matSum').textContent=money(m);$('#extraSum').textContent=money(e);$('#costSum').textContent=money(cost);$('#profitSum').textContent=money(profit);$('#finalSum').textContent=money(cost+profit);return {q,l,m,e,cost,margin,profit,total:cost+profit}}$('#saveQuote').onclick=()=>{const c=calc(),idx=$('#service').value,desc=idx==='custom'?($('#customName').value.trim()||'Serviço personalizado'):catalog[Number(idx)][1];const quote={id:Date.now(),date:new Date().toLocaleDateString('pt-BR'),client:$('#client').value.trim()||'Cliente não informado',desc,...c,professional:settings.name,phone:settings.phone};quotes.unshift(quote);persist();alert('Orçamento salvo neste aparelho!');go('saved')};calc();}
else if(page==='catalog'){root.innerHTML=`<h1 class="section-title">Catálogo de serviços</h1><p class="muted">Valores de referência de mão de obra (R$).</p><div class="field"><input id="search" placeholder="⌕ Buscar serviço"></div><div id="catalogList"></div>`;const list=()=>{let q=$('#search').value.toLowerCase();$('#catalogList').innerHTML=catalog.filter(s=>s[1].toLowerCase().includes(q)||s[0].toLowerCase().includes(q)).map(s=>`<div class="service"><div class="row between"><strong>${s[1]}</strong><span class="pill">${s[0]}</span></div><div class="muted small" style="margin-top:6px">Mín. ${money(s[2])}　 Médio <b style="color:var(--yellow)">${money(s[3])}</b>　 Máx. ${money(s[4])}</div></div>`).join('')};$('#search').oninput=list;list()}
else if(page==='saved'){root.innerHTML=`<h1 class="section-title">Meus orçamentos</h1>${quotes.length?quotes.map(q=>`<article class="card"><div class="row between"><strong>${q.client}</strong><span class="pill">${q.date}</span></div><p class="muted">${q.desc} · ${q.q} un.</p><div class="row between"><span class="muted">Valor final</span><strong class="amount" style="font-size:22px">${money(q.total)}</strong></div><div class="row" style="margin-top:12px"><button class="btn primary" data-print="${q.id}" style="flex:1">▤ Ver / imprimir</button><button class="btn secondary" data-share="${q.id}">Compartilhar</button><button class="btn secondary danger" data-del="${q.id}">×</button></div></article>`).join(''):'<div class="card empty">Ainda não há orçamentos salvos.<br>Toque em “Orçamento” para criar o primeiro.</div>'}`;root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este orçamento?')){quotes=quotes.filter(q=>q.id!==Number(b.dataset.del));persist();render()}});root.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printQuote(Number(b.dataset.print)));root.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>shareQuote(Number(b.dataset.share)));}
else if(page==='settings'){root.innerHTML=`<h1 class="section-title">Configurações</h1><div class="card"><div class="row"><img class="portrait" src="carlos.jpg" alt="Carlos"><div><strong>Identidade profissional</strong><div class="muted small">Estes dados aparecem no orçamento.</div></div></div><div class="field"><label>Nome completo</label><input id="profName" value="${esc(settings.name)}"></div><div class="field"><label>Telefone</label><input id="profPhone" value="${esc(settings.phone)}" inputmode="tel"></div><div class="field"><label>Margem padrão de lucro (%)</label><input id="profMargin" type="number" min="0" max="100" value="${settings.margin}"></div><button class="btn primary full" id="saveSettings">SALVAR CONFIGURAÇÕES</button></div><button class="btn secondary full" id="export">Exportar cópia dos orçamentos (JSON)</button><p class="notice">Os dados ficam armazenados localmente no navegador deste aparelho. Exporte uma cópia periodicamente para evitar perdê-los ao limpar os dados do navegador.</p>`;$('#saveSettings').onclick=()=>{settings.name=$('#profName').value.trim()||defaults.name;settings.phone=$('#profPhone').value.trim()||defaults.phone;settings.margin=Math.min(100,Math.max(0,Number($('#profMargin').value)||0));persist();alert('Configurações salvas.');go('home')};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({settings,quotes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carly-electric-backup.json';a.click();URL.revokeObjectURL(a.href)}}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function quoteText(q){return `CARLY ELECTRIC\nORÇAMENTO DE SERVIÇOS ELÉTRICOS\nProfissional: ${q.professional}\nTelefone: ${q.phone}\nCliente: ${q.client}\nData: ${q.date}\nServiço: ${q.desc}\nQuantidade: ${q.q}\nMão de obra: ${money(q.l)}\nMateriais: ${money(q.m)}\nOutros gastos: ${money(q.e)}\nCusto total: ${money(q.cost)}\nLucro (${q.margin}%): ${money(q.profit)}\nTOTAL: ${money(q.total)}\nValidade e condições a combinar.`}function printQuote(id){let q=quotes.find(x=>x.id===id);if(!q)return;let w=window.open('','_blank');if(!w){alert('Permita janelas pop-up para imprimir o orçamento.');return}w.document.write(`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Orçamento Carly Electric</title><style>body{font:16px Arial;padding:30px;color:#222;max-width:760px;margin:auto}.head{background:#080808;color:white;padding:20px;border-radius:10px}.gold{color:#d6b900}table{width:100%;border-collapse:collapse;margin:24px 0}td{padding:10px;border-bottom:1px solid #ddd}.right{text-align:right}.total{font-size:24px;font-weight:bold;color:#8a7300}small{color:#666}</style><div class="head"><h1>⚡ CARLY <span class="gold">ELECTRIC</span></h1><div>ORÇAMENTO DE SERVIÇOS ELÉTRICOS</div></div><p><b>Profissional:</b> ${esc(q.professional)}<br><b>Telefone:</b> ${esc(q.phone)}<br><b>Cliente:</b> ${esc(q.client)}<br><b>Data:</b> ${esc(q.date)}</p><table><tr><td><b>Serviço</b></td><td class="right">${esc(q.desc)}</td></tr><tr><td>Quantidade</td><td class="right">${q.q}</td></tr><tr><td>Mão de obra</td><td class="right">${money(q.l)}</td></tr><tr><td>Materiais</td><td class="right">${money(q.m)}</td></tr><tr><td>Transporte e outros gastos</td><td class="right">${money(q.e)}</td></tr><tr><td>Custo total</td><td class="right">${money(q.cost)}</td></tr><tr><td>Lucro previsto (${q.margin}%)</td><td class="right">${money(q.profit)}</td></tr><tr><td class="total">VALOR FINAL</td><td class="right total">${money(q.total)}</td></tr></table><p>Validade e condições do serviço a combinar com o cliente.</p><small>Orçamento gerado por Carly Electric.</small><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}async function shareQuote(id){let q=quotes.find(x=>x.id===id);if(!q)return;let text=quoteText(q);if(navigator.share){try{await navigator.share({title:'Orçamento Carly Electric',text})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('Orçamento copiado. Cole no WhatsApp ou em outra conversa.')}else{prompt('Copie o orçamento:',text)}}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
